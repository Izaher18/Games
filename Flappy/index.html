<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flappy</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <header class="top">
        <p class="kicker">Arcade classic</p>
        <h1>Flappy</h1>
        <div class="scores">
          <div class="score">
            <span class="chip pipe"></span>
            <span>Score</span>
            <span class="tally" id="score">0</span>
          </div>
          <div class="score">
            <span class="chip crown"></span>
            <span>Best</span>
            <span class="tally" id="best">0</span>
          </div>
        </div>
        <p class="status" id="status" role="status"></p>
      </header>

      <div class="stage" id="stage">
        <canvas class="field" id="field" width="400" height="600" aria-label="Flappy playing field"></canvas>
      </div>

      <div class="actions">
        <button class="restart" id="restart" type="button">New game</button>
      </div>

      <p class="help" id="help">Space, Up, or a click to flap</p>
    </main>
    <script src="game.js"></script>
    <script src="main.js"></script>
  </body>
</html>
