<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minesweeper</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <header class="top">
        <p class="kicker">Puzzle classic</p>
        <h1>Minesweeper</h1>
        <div class="scores">
          <div class="score">
            <span class="chip mine"></span>
            <span>Mines</span>
            <span class="tally" id="mines">0</span>
          </div>
        </div>
        <p class="status" id="status" role="status"></p>
      </header>

      <div class="stage">
        <div class="board" id="board" role="grid" aria-label="Minesweeper board"></div>
      </div>

      <div class="actions">
        <button class="restart" id="restart" type="button">New game</button>
      </div>

      <p class="help" id="help">Click to clear a cell. Right-click flags it, then leaves a question mark.</p>
    </main>
    <script src="game.js"></script>
    <script src="main.js"></script>
  </body>
</html>
