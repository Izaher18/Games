<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>2048</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <header class="top">
        <p class="kicker">Puzzle classic</p>
        <h1>2048</h1>
        <div class="scores">
          <div class="score">
            <span class="chip square"></span>
            <span>Score</span>
            <span class="tally" id="score">0</span>
          </div>
          <div class="score">
            <span class="chip crown"></span>
            <span>Best</span>
            <span class="tally" id="best">0</span>
          </div>
        </div>
        <p class="status" id="status" role="status"></p>
      </header>

      <div class="board" id="board" role="img" aria-label="2048 board">
        <div class="cells" id="cells" aria-hidden="true"></div>
        <div class="tiles" id="tiles" aria-hidden="true"></div>
        <div class="hint" id="hint-arrow" aria-hidden="true"><span class="hint-badge"></span></div>
        <div class="overlay" id="overlay" hidden>
          <p class="overlay-title" id="overlay-title"></p>
          <div class="overlay-actions">
            <button class="secondary" id="keep-going" type="button">Keep going</button>
            <button class="restart" id="try-again" type="button">New game</button>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="secondary" id="undo" type="button">Undo</button>
        <button class="secondary" id="hint" type="button">Hint</button>
        <button class="secondary" id="auto" type="button" aria-pressed="false">Autoplay</button>
        <button class="restart" id="restart" type="button">New game</button>
      </div>

      <p class="help" id="help">Arrow keys or WASD to slide, or swipe on the board · U to undo · H for a hint · P to autoplay</p>
    </main>
    <script src="game.js"></script>
    <script src="ai.js"></script>
    <script src="main.js"></script>
  </body>
</html>
