<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connect Four</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <header class="top">
        <p class="kicker" id="kicker">Versus computer</p>
        <h1>Connect Four</h1>
        <div class="modes" role="group" aria-label="Who plays yellow">
          <button class="mode is-selected" id="mode-computer" type="button" aria-pressed="true">
            Computer
          </button>
          <button class="mode" id="mode-people" type="button" aria-pressed="false">
            Two players
          </button>
        </div>
        <div class="modes" id="starters" role="group" aria-label="Who moves first">
          <button class="mode is-selected" id="start-first" type="button" aria-pressed="true">
            You
          </button>
          <button class="mode" id="start-second" type="button" aria-pressed="false">
            Computer
          </button>
        </div>
        <div class="modes" id="difficulties" role="group" aria-label="Computer difficulty">
          <button class="mode" id="difficulty-easy" type="button" aria-pressed="false">Easy</button>
          <button class="mode is-selected" id="difficulty-medium" type="button" aria-pressed="true">
            Medium
          </button>
          <button class="mode" id="difficulty-hard" type="button" aria-pressed="false">Hard</button>
        </div>
        <div class="players">
          <div class="player" id="player-one">
            <span class="chip red"></span>
            <span id="player-one-name">You</span>
            <span class="tally" id="player-one-score">0</span>
          </div>
          <div class="player" id="player-two">
            <span class="chip yellow"></span>
            <span id="player-two-name">Computer</span>
            <span class="tally" id="player-two-score">0</span>
          </div>
        </div>
        <p class="status" id="status" role="status"></p>
        <p class="draws">
          <span id="draws">Draws 0</span>
          <button class="linkish" id="clear-scores" type="button">Clear scores</button>
        </p>
      </header>

      <div class="stage" id="stage">
        <div class="table">
          <div class="board" id="board" role="group" aria-label="Connect Four board"></div>
          <div class="feet" aria-hidden="true"></div>
        </div>
      </div>

      <div class="actions">
        <button class="secondary" id="undo" type="button">Undo</button>
        <button class="secondary" id="hint" type="button">Hint</button>
        <button class="secondary" id="sound" type="button" aria-pressed="true">Sound on</button>
        <button class="restart" id="restart" type="button">Play again</button>
      </div>
    </main>
    <script src="board.js"></script>
    <script src="ai.js"></script>
    <script src="main.js"></script>
  </body>
</html>
